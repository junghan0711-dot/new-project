<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>115 雲嘉南多元計畫進度填報</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">115 雲嘉南多元就業開發方案</p>
        <h1>工項進度填報</h1>
      </div>
      <div class="top-actions">
        <a id="sheetLink" class="button ghost" href="#" target="_blank" rel="noreferrer">開啟來源表</a>
        <button id="refreshButton" class="button" type="button">重新整理</button>
      </div>
    </header>

    <main class="layout">
      <section class="panel summary-panel" aria-label="進度摘要">
        <div class="metric">
          <span>全部工項</span>
          <strong id="totalTasks">0</strong>
        </div>
        <div class="metric">
          <span>已完成</span>
          <strong id="doneTasks">0</strong>
        </div>
        <div class="metric">
          <span>待追蹤</span>
          <strong id="openTasks">0</strong>
        </div>
        <div class="metric">
          <span>目前資料</span>
          <strong id="dataMode">未連線</strong>
        </div>
      </section>

      <section class="panel controls-panel" aria-label="篩選任務">
        <label>
          <span>填報人</span>
          <input id="reporterInput" type="text" autocomplete="name" placeholder="請輸入姓名" />
        </label>
        <label>
          <span>主責及協辦</span>
          <select id="personFilter">
            <option value="">全部</option>
          </select>
        </label>
        <label>
          <span>完成狀態</span>
          <select id="statusFilter">
            <option value="">全部</option>
            <option value="未確認">未確認</option>
            <option value="進行中">進行中</option>
            <option value="未完成">未完成</option>
            <option value="已完成">已完成</option>
          </select>
        </label>
        <label class="search-field">
          <span>搜尋</span>
          <input id="searchInput" type="search" placeholder="工項、進度、時程關鍵字" />
        </label>
      </section>

      <nav class="view-tabs" aria-label="資料檢視">
        <button class="tab-button active" type="button" data-view="tasksView">任務填報</button>
        <button class="tab-button" type="button" data-view="sourceView">資料總覽</button>
        <button class="tab-button" type="button" data-view="updatesView">更新與費用紀錄</button>
        <button class="tab-button" type="button" data-view="casesView">案件追蹤列管</button>
      </nav>

      <section id="tasksView" class="workspace view-section active">
        <aside class="panel task-list-panel" aria-label="任務清單">
          <div class="section-heading">
            <h2>工項清單</h2>
            <span id="visibleCount">0 筆</span>
          </div>
          <div id="taskList" class="task-list"></div>
        </aside>

        <section class="panel detail-panel" aria-label="填報表單">
          <div id="emptyState" class="empty-state">
            <h2>選擇左側工項</h2>
            <p>選到工項後即可更新進度、完成狀態、下次追蹤日期與費用。</p>
          </div>

          <form id="progressForm" class="progress-form hidden">
            <div class="section-heading">
              <div>
                <p id="selectedItem" class="eyebrow"></p>
                <h2 id="selectedTask"></h2>
              </div>
              <span id="selectedStatus" class="status-pill"></span>
            </div>

            <div class="detail-grid">
              <div>
                <span class="field-label">主責及協辦</span>
                <p id="selectedOwner"></p>
              </div>
              <div>
                <span class="field-label">預計執行時程</span>
                <p id="selectedDue"></p>
              </div>
              <div>
                <span class="field-label">核定/預估經費</span>
                <p id="selectedFee"></p>
              </div>
            </div>

            <div class="source-detail">
              <span class="field-label">原始更新內容</span>
              <p id="selectedProgressText"></p>
            </div>

            <div class="source-detail">
              <span class="field-label">履約內容 / 時程 / 經費說明</span>
              <p id="selectedSourceNote"></p>
            </div>

            <label>
              <span>最新進度</span>
              <textarea id="progressInput" rows="7" required placeholder="請填寫本次更新內容、目前完成情形、需要協助事項"></textarea>
            </label>

            <div class="form-grid">
              <label>
                <span>完成狀態</span>
                <select id="completeInput" required>
                  <option value="未確認">未確認</option>
                  <option value="進行中">進行中</option>
                  <option value="未完成">未完成</option>
                  <option value="已完成">已完成</option>
                </select>
              </label>
              <label>
                <span>下次追蹤日期</span>
                <input id="nextDateInput" type="date" />
              </label>
              <label>
                <span>本次費用</span>
                <input id="expenseInput" type="number" min="0" step="1" placeholder="0" />
              </label>
              <label>
                <span>費用明細</span>
                <input id="expenseDetailInput" type="text" placeholder="例：場地費、印刷費" />
              </label>
            </div>

            <label>
              <span>備註</span>
              <textarea id="noteInput" rows="3" placeholder="其他補充、憑證位置或管理提醒"></textarea>
            </label>

            <div class="form-actions">
              <p id="formMessage" role="status"></p>
              <button id="submitButton" class="button primary" type="submit">送出更新</button>
            </div>
          </form>
        </section>
      </section>

      <section id="sourceView" class="panel source-panel view-section" aria-label="資料總覽">
        <div class="section-heading">
          <div>
            <h2>資料總覽</h2>
            <p id="sourceMeta" class="subtle"></p>
          </div>
          <label class="compact-search">
            <span>搜尋全部內容</span>
            <input id="sourceSearchInput" type="search" placeholder="輸入關鍵字" />
          </label>
        </div>
        <div id="sheetTabs" class="sheet-tabs"></div>
        <div class="source-table-wrap">
          <table id="sourceTable" class="source-table"></table>
        </div>
      </section>

      <section id="updatesView" class="panel updates-panel view-section" aria-label="更新與費用紀錄">
        <div class="section-heading">
          <h2>更新與費用紀錄</h2>
          <span id="recordCount">0 筆</span>
        </div>
        <div class="records-grid">
          <div>
            <h3>進度更新紀錄</h3>
            <div id="updatesList" class="record-list"></div>
          </div>
          <div>
            <h3>經費支出紀錄</h3>
            <div id="expensesList" class="record-list"></div>
          </div>
        </div>
      </section>

      <section id="casesView" class="panel cases-panel view-section" aria-label="案件追蹤列管">
        <div class="section-heading">
          <div>
            <h2>案件追蹤列管</h2>
            <p class="subtle">交辦任務、指定同事、查核點、Deadline 與進度回報集中追蹤。</p>
          </div>
          <span id="caseCount">0 筆</span>
        </div>

        <div class="case-workspace">
          <form id="caseForm" class="case-form">
            <div class="form-grid case-form-grid">
              <label>
                <span>案件名稱</span>
                <input id="caseTitleInput" type="text" required placeholder="例：多元團隊研習成果彙整" />
              </label>
              <label>
                <span>指定同事</span>
                <input id="caseAssigneeInput" list="caseAssigneeOptions" type="text" required placeholder="輸入或選擇同事" />
                <datalist id="caseAssigneeOptions"></datalist>
              </label>
              <label>
                <span>Deadline</span>
                <input id="caseDeadlineInput" type="datetime-local" required />
              </label>
              <label>
                <span>狀態</span>
                <select id="caseStatusInput" required>
                  <option value="待執行">待執行</option>
                  <option value="進行中">進行中</option>
                  <option value="待查核">待查核</option>
                  <option value="已完成">已完成</option>
                </select>
              </label>
            </div>

            <label>
              <span>交辦內容</span>
              <textarea id="caseInstructionInput" rows="4" required placeholder="請寫清楚交辦事項、交付格式、需要協調的人或資料"></textarea>
            </label>

            <label>
              <span>查核點</span>
              <textarea id="caseCheckpointInput" rows="3" required placeholder="例：6/5 12:00 前回報初稿；6/6 前確認照片與簽到資料"></textarea>
            </label>

            <label>
              <span>目前進度說明</span>
              <textarea id="caseProgressInput" rows="4" required placeholder="填寫目前執行到哪裡、卡關事項、下一步"></textarea>
            </label>

            <div class="form-grid case-form-grid">
              <label>
                <span>回報人</span>
                <input id="caseReporterInput" type="text" autocomplete="name" placeholder="預設帶入上方填報人" />
              </label>
              <label>
                <span>優先序</span>
                <select id="casePriorityInput">
                  <option value="一般">一般</option>
                  <option value="高">高</option>
                  <option value="急件">急件</option>
                </select>
              </label>
              <label class="case-note-field">
                <span>備註</span>
                <input id="caseNoteInput" type="text" placeholder="補充連結、檔案位置或管理提醒" />
              </label>
            </div>

            <div class="form-actions">
              <p id="caseFormMessage" role="status"></p>
              <button id="caseSubmitButton" class="button primary" type="submit">送出列管</button>
            </div>
          </form>

          <div class="case-board">
            <div class="case-toolbar">
              <label>
                <span>負責同事</span>
                <select id="caseAssigneeFilter">
                  <option value="">全部</option>
                </select>
              </label>
              <label>
                <span>案件狀態</span>
                <select id="caseStatusFilter">
                  <option value="">全部</option>
                  <option value="待執行">待執行</option>
                  <option value="進行中">進行中</option>
                  <option value="待查核">待查核</option>
                  <option value="已完成">已完成</option>
                </select>
              </label>
              <label>
                <span>搜尋</span>
                <input id="caseSearchInput" type="search" placeholder="案件、查核點、進度" />
              </label>
            </div>
            <div id="caseList" class="case-list"></div>
          </div>
        </div>
      </section>
    </main>

    <template id="taskTemplate">
      <button class="task-card" type="button">
        <span class="task-card-top">
          <strong class="task-title"></strong>
          <span class="status-pill task-status"></span>
        </span>
        <span class="task-item"></span>
        <span class="task-meta"></span>
      </button>
    </template>

    <script src="./config.js?v=api-20260603"></script>
    <script src="./data.js"></script>
    <script src="./app.js?v=case-tracking-20260604"></script>
  </body>
</html>
