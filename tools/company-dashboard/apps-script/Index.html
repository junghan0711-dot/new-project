<!doctype html>
<html lang="zh-Hant">
  <head>
    <base target="_top" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f7f8;
        --panel: #ffffff;
        --ink: #17202a;
        --muted: #667085;
        --line: #d8dee8;
        --brand: #1f6f78;
        --brand-dark: #15535a;
        --red: #b8321f;
        --yellow: #9a6512;
        --green: #1f7a4d;
        --shadow: 0 10px 28px rgba(25, 38, 52, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
        line-height: 1.5;
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 5;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        padding: 20px 26px;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      h1 {
        font-size: 26px;
        font-weight: 780;
      }

      h2 {
        font-size: 18px;
      }

      h3 {
        font-size: 15px;
      }

      .eyebrow {
        color: var(--brand);
        font-size: 13px;
        font-weight: 800;
        margin-bottom: 4px;
      }

      .subtle {
        color: var(--muted);
        font-size: 13px;
      }

      .button {
        border: 1px solid var(--brand);
        border-radius: 6px;
        background: #ffffff;
        color: var(--brand);
        padding: 9px 12px;
        min-height: 38px;
        font: inherit;
        font-size: 14px;
        font-weight: 760;
        text-decoration: none;
        cursor: pointer;
      }

      .button:hover {
        background: #edf7f8;
      }

      .button.primary {
        background: var(--brand);
        color: #ffffff;
      }

      .button.compact {
        min-height: 30px;
        padding: 5px 8px;
        font-size: 12px;
      }

      .button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .top-actions {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }

      .layout {
        width: min(1440px, 100%);
        margin: 0 auto;
        padding: 22px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .summary-grid {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 1px;
        margin-bottom: 16px;
      }

      .metric {
        padding: 16px;
        background: #ffffff;
      }

      .metric span {
        display: block;
        color: var(--muted);
        font-size: 13px;
        margin-bottom: 6px;
      }

      .metric strong {
        font-size: 24px;
      }

      .project-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
        margin-bottom: 16px;
      }

      .project-card {
        display: grid;
        gap: 12px;
        padding: 14px;
      }

      .project-card.red {
        border-color: #d14b32;
      }

      .project-card.yellow {
        border-color: #e6b04a;
      }

      .project-card.green {
        border-color: #b8dcc9;
      }

      .project-head {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: flex-start;
      }

      .status-dot {
        display: inline-flex;
        align-items: center;
        min-height: 24px;
        border-radius: 999px;
        padding: 3px 9px;
        font-size: 12px;
        font-weight: 800;
      }

      .status-dot.red {
        background: #feece8;
        color: var(--red);
      }

      .status-dot.yellow {
        background: #fff4df;
        color: var(--yellow);
      }

      .status-dot.green {
        background: #e8f5ee;
        color: var(--green);
      }

      .mini-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 8px;
      }

      .mini {
        display: grid;
        gap: 3px;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: #fbfcfd;
      }

      .mini span {
        color: var(--muted);
        font-size: 12px;
      }

      .mini strong {
        font-size: 18px;
      }

      .dashboard-grid {
        display: grid;
        grid-template-columns: minmax(360px, 1fr) minmax(360px, 1fr);
        gap: 16px;
      }

      .priority-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
        margin-bottom: 16px;
      }

      .block {
        display: grid;
        gap: 12px;
        padding: 14px;
      }

      .list {
        display: grid;
        gap: 9px;
        max-height: 560px;
        overflow: auto;
      }

      .item {
        display: grid;
        gap: 5px;
        padding: 11px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: #fbfcfd;
      }

      .item strong {
        font-size: 14px;
      }

      .item p,
      .item span {
        color: var(--muted);
        font-size: 13px;
      }

      .item.critical {
        border-color: #d14b32;
        background: #fffafa;
      }

      .item.warning {
        border-color: #e6b04a;
        background: #fffaf1;
      }

      .item.today {
        border-color: #d8841b;
        background: #fffaf1;
      }

      .item.reminder {
        border-color: var(--line);
      }

      .workload-grid,
      .assignment-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .workload-card {
        display: grid;
        gap: 8px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: #fbfcfd;
      }

      .workload-card.high {
        border-color: #d14b32;
        background: #fffafa;
      }

      .workload-card.medium {
        border-color: #e6b04a;
        background: #fffaf1;
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      label {
        display: grid;
        gap: 6px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 760;
      }

      input,
      select,
      textarea {
        width: 100%;
        border: 1px solid #cbd3df;
        border-radius: 6px;
        padding: 10px 11px;
        background: #ffffff;
        color: var(--ink);
        font: inherit;
      }

      textarea {
        resize: vertical;
      }

      .message {
        min-height: 20px;
        color: var(--muted);
        font-size: 13px;
      }

      .message.success {
        color: var(--green);
      }

      .message.error {
        color: var(--red);
      }

      .notice {
        padding: 10px 11px;
        border: 1px solid #f0b5a7;
        border-radius: 7px;
        background: #fffafa;
        color: var(--red);
        font-size: 13px;
      }

      .reminder-textarea {
        min-height: 280px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        font-size: 13px;
        white-space: pre;
      }

      .people-table {
        width: 100%;
        border-collapse: collapse;
        min-width: 640px;
      }

      .review-table {
        width: 100%;
        border-collapse: collapse;
        min-width: 1280px;
      }

      .review-filters {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
      }

      .text-cell {
        max-width: 320px;
        color: var(--muted);
      }

      .link-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .action-row {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        min-width: 180px;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        min-height: 24px;
        border-radius: 999px;
        padding: 3px 9px;
        font-size: 12px;
        font-weight: 800;
        white-space: nowrap;
      }

      .badge.critical {
        background: #feece8;
        color: var(--red);
      }

      .badge.warning,
      .badge.today {
        background: #fff4df;
        color: var(--yellow);
      }

      .badge.notice,
      .badge.reminder {
        background: #edf2f7;
        color: var(--muted);
      }

      .table-wrap {
        overflow: auto;
      }

      th,
      td {
        padding: 10px 11px;
        border-bottom: 1px solid var(--line);
        text-align: left;
        font-size: 13px;
        vertical-align: top;
      }

      th {
        color: var(--muted);
        background: #f6f8fb;
        font-weight: 800;
      }

      .auth-panel {
        display: grid;
        gap: 10px;
        padding: 28px;
        margin: 22px auto;
        width: min(720px, calc(100% - 32px));
      }

      .hidden {
        display: none;
      }

      @media (max-width: 980px) {
        .topbar {
          align-items: stretch;
          flex-direction: column;
        }

        .summary-grid,
        .project-grid,
        .dashboard-grid,
        .mini-grid,
        .priority-grid,
        .workload-grid,
        .assignment-grid,
        .review-filters,
        .form-grid {
          grid-template-columns: 1fr;
        }

        .layout {
          padding: 14px;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">公司營運管理</p>
        <h1>公司專案總控台</h1>
        <p id="metaText" class="subtle">讀取中</p>
      </div>
      <div class="top-actions">
        <button id="sendReminderButton" class="button" type="button">寄出提醒</button>
        <button id="refreshButton" class="button primary" type="button">重新整理</button>
      </div>
    </header>

    <section id="authPanel" class="panel auth-panel hidden">
      <h2>無法進入公司總控台</h2>
      <p id="authMessage" class="subtle"></p>
    </section>

    <main id="dashboard" class="layout hidden">
      <section id="summaryGrid" class="panel summary-grid" aria-label="公司摘要"></section>
      <section id="projectGrid" class="project-grid" aria-label="專案狀態"></section>
      <section class="priority-grid" aria-label="待辦優先序">
        <section class="panel block">
          <h2>今天必追</h2>
          <div id="priorityTodayList" class="list"></div>
        </section>
        <section class="panel block">
          <h2>本週需追</h2>
          <div id="priorityWeekList" class="list"></div>
        </section>
        <section class="panel block">
          <h2>逾期</h2>
          <div id="priorityOverdueList" class="list"></div>
        </section>
        <section class="panel block">
          <h2>提醒</h2>
          <div id="priorityReminderList" class="list"></div>
        </section>
      </section>
      <section class="panel block" aria-label="主管待查核清單">
        <div class="project-head">
          <div>
            <h2>主管待查核清單</h2>
            <p id="reviewCountText" class="subtle"></p>
          </div>
        </div>
        <div class="review-filters">
          <label>
            <span>專案</span>
            <select id="reviewProjectFilter"></select>
          </label>
          <label>
            <span>同仁</span>
            <select id="reviewAssigneeFilter"></select>
          </label>
          <label>
            <span>狀態</span>
            <select id="reviewStatusFilter"></select>
          </label>
          <label>
            <span>優先序</span>
            <select id="reviewPriorityFilter"></select>
          </label>
        </div>
        <p id="reviewActionMessage" class="message" role="status"></p>
        <div class="table-wrap">
          <table class="review-table">
            <thead>
              <tr>
                <th>查核原因</th>
                <th>專案</th>
                <th>案件</th>
                <th>同仁</th>
                <th>狀態</th>
                <th>Deadline</th>
                <th>最近回報</th>
                <th>最新進度</th>
                <th>連結</th>
                <th>主管動作</th>
              </tr>
            </thead>
            <tbody id="reviewRows"></tbody>
          </table>
        </div>
      </section>
      <section class="dashboard-grid">
        <section class="panel block">
          <h2>主管交辦中心</h2>
          <form id="assignmentForm" class="assignment-grid">
            <label>
              <span>專案</span>
              <select id="assignmentProjectInput" required></select>
            </label>
            <label>
              <span>指定同事</span>
              <input id="assignmentAssigneeInput" type="text" list="assignmentAssigneeOptions" required placeholder="輸入同仁姓名" />
              <datalist id="assignmentAssigneeOptions"></datalist>
            </label>
            <label>
              <span>案件名稱</span>
              <input id="assignmentTitleInput" type="text" required placeholder="例：成果資料補件追蹤" />
            </label>
            <label>
              <span>Deadline</span>
              <input id="assignmentDeadlineInput" type="datetime-local" required />
            </label>
            <label>
              <span>優先序</span>
              <select id="assignmentPriorityInput">
                <option value="一般">一般</option>
                <option value="高">高</option>
                <option value="急件">急件</option>
              </select>
            </label>
            <label>
              <span>狀態</span>
              <select id="assignmentStatusInput">
                <option value="待執行">待執行</option>
                <option value="進行中">進行中</option>
                <option value="待查核">待查核</option>
              </select>
            </label>
            <label style="grid-column: 1 / -1">
              <span>交辦內容</span>
              <textarea id="assignmentInstructionInput" rows="4" required placeholder="請寫清楚交辦事項、交付格式、需要協調的人或資料"></textarea>
            </label>
            <label style="grid-column: 1 / -1">
              <span>查核點</span>
              <textarea id="assignmentCheckpointInput" rows="3" placeholder="例：週三前回報初稿；週五前補齊佐證"></textarea>
            </label>
            <label style="grid-column: 1 / -1">
              <span>備註</span>
              <input id="assignmentNoteInput" type="text" placeholder="補充提醒、檔案位置或主管查核意見" />
            </label>
            <label style="grid-column: 1 / -1">
              <span>佐證資料連結</span>
              <input id="assignmentAttachmentInput" type="url" placeholder="貼上雲端資料夾、文件或成果連結" />
            </label>
            <p id="assignmentMessage" class="message" role="status"></p>
            <button id="assignmentSubmitButton" class="button primary" type="submit">送出交辦</button>
          </form>
        </section>
        <section class="panel block">
          <h2>提醒中心</h2>
          <p id="reminderStatus" class="subtle"></p>
          <div class="top-actions">
            <button id="copyReminderButton" class="button" type="button">複製摘要</button>
          </div>
          <textarea id="reminderText" class="reminder-textarea" readonly></textarea>
          <div id="reminderPreview" class="list"></div>
          <p id="reminderMessage" class="message" role="status"></p>
        </section>
        <section class="panel block">
          <h2>今日需追蹤</h2>
          <div id="followUpList" class="list"></div>
        </section>
        <section class="panel block">
          <h2>資料品質提醒</h2>
          <div id="issueList" class="list"></div>
        </section>
        <section class="panel block" style="grid-column: 1 / -1">
          <h2>同仁工作量看板</h2>
          <div id="workloadGrid" class="workload-grid"></div>
        </section>
        <section class="panel block" style="grid-column: 1 / -1">
          <h2>同仁更新狀態</h2>
          <div class="table-wrap">
            <table class="people-table">
              <thead>
                <tr>
                  <th>同仁</th>
                  <th>專案</th>
                  <th>負責工項</th>
                  <th>近 7 日更新</th>
                  <th>需追蹤</th>
                  <th>最近更新</th>
                </tr>
              </thead>
              <tbody id="peopleRows"></tbody>
            </table>
          </div>
        </section>
      </section>
    </main>

    <script>
      const initialAuth = <?!= initialAuth ?>;
      const $ = (id) => document.getElementById(id);
      let dashboardData = null;
      const reviewFilters = {
        projectId: "",
        assignee: "",
        status: "",
        priority: "",
      };

      $("refreshButton").addEventListener("click", loadDashboard);
      $("sendReminderButton").addEventListener("click", sendReminderDigest);
      $("copyReminderButton").addEventListener("click", copyReminderText);
      $("assignmentForm").addEventListener("submit", submitAssignment);
      $("reviewProjectFilter").addEventListener("change", updateReviewFilters);
      $("reviewAssigneeFilter").addEventListener("change", updateReviewFilters);
      $("reviewStatusFilter").addEventListener("change", updateReviewFilters);
      $("reviewPriorityFilter").addEventListener("change", updateReviewFilters);
      $("reviewRows").addEventListener("click", handleReviewActionClick);
      loadDashboard();

      function loadDashboard() {
        $("refreshButton").disabled = true;
        $("refreshButton").textContent = "讀取中";
        google.script.run
          .withSuccessHandler((payload) => {
            $("refreshButton").disabled = false;
            $("refreshButton").textContent = "重新整理";
            if (!payload || payload.ok === false) {
              renderAuth(payload && payload.auth ? payload.auth : initialAuth, payload && payload.error);
              return;
            }
            renderDashboard(payload);
          })
          .withFailureHandler((error) => {
            $("refreshButton").disabled = false;
            $("refreshButton").textContent = "重新整理";
            renderAuth(initialAuth, error && error.message ? error.message : "讀取資料失敗");
          })
          .getDashboardData();
      }

      function renderAuth(auth, error) {
        $("dashboard").classList.add("hidden");
        $("authPanel").classList.remove("hidden");
        $("authMessage").textContent = error || (auth && auth.message) || "此帳號未授權。";
        $("metaText").textContent = auth && auth.email ? `目前帳號：${auth.email}` : "請使用已授權的 Google 帳號登入。";
      }

      function renderDashboard(payload) {
        dashboardData = payload;
        $("authPanel").classList.add("hidden");
        $("dashboard").classList.remove("hidden");
        $("metaText").textContent = `登入帳號：${payload.viewer} / 資料時間：${payload.generatedAt}`;
        renderSummary(payload.totals);
        renderProjects(payload.projects);
        renderAssignmentProjects(payload.projects);
        renderAssignmentPeople(payload.workload);
        renderReviewFilters(payload);
        renderReviewQueue();
        renderPriorities(payload.priorities);
        renderFollowUps(payload.followUps);
        renderIssues(payload.issues);
        renderReminder(payload);
        renderWorkload(payload.workload);
        renderPeople(payload.people);
      }

      function renderSummary(totals) {
        const metrics = [
          ["專案數", totals.projects],
          ["紅燈", totals.redProjects],
          ["黃燈", totals.yellowProjects],
          ["待追蹤工項", totals.needsFollowUp],
          ["未完成案件", totals.openCases],
          ["本月輔導", totals.consultationsThisMonth],
        ];
        $("summaryGrid").innerHTML = metrics.map(([label, value]) => (
          `<div class="metric"><span>${escapeHtml(label)}</span><strong>${formatNumber(value)}</strong></div>`
        )).join("");
      }

      function renderProjects(projects) {
        $("projectGrid").innerHTML = projects.map((project) => {
          const label = project.status === "red" ? "紅燈" : project.status === "yellow" ? "黃燈" : "綠燈";
          const errorBlock = project.error ? `<p class="notice">資料來源讀取失敗：${escapeHtml(project.error)}</p>` : "";
          return `
            <article class="panel project-card ${project.status}">
              <div class="project-head">
                <div>
                  <h2>${escapeHtml(project.name)}</h2>
                  <p class="subtle">資料時間：${escapeHtml(project.latestDataTime || "未記錄")}</p>
                </div>
                <span class="status-dot ${project.status}">${label}</span>
              </div>
              <div class="mini-grid">
                ${mini("工項", `${project.metrics.doneItems}/${project.metrics.items}`)}
                ${mini("需追蹤", project.metrics.needsFollowUp)}
                ${mini("未完成案件", project.metrics.openCases)}
                ${mini("本月輔導", project.metrics.consultationsThisMonth)}
              </div>
              ${errorBlock}
              <p class="subtle">逾期 ${project.metrics.overdueCases} / 待查核 ${project.metrics.awaitingReview} / 憑證缺漏 ${project.metrics.expensesMissingVoucher}</p>
              <div>
                <a class="button" href="${project.pageUrl}" target="_blank" rel="noreferrer">開啟專案頁</a>
                <a class="button" href="${project.spreadsheetUrl}" target="_blank" rel="noreferrer">開啟底表</a>
              </div>
            </article>
          `;
        }).join("");
      }

      function renderFollowUps(items) {
        $("followUpList").innerHTML = items.length ? items.map((item) => `
          <article class="item ${item.reason === "已逾期" ? "critical" : "warning"}">
            <strong>${escapeHtml(item.project)} / ${escapeHtml(item.type)} / ${escapeHtml(item.title || "未命名")}</strong>
            <p>${escapeHtml(item.assignee || "未指定")} / ${escapeHtml(item.status || "未填狀態")} / ${escapeHtml(item.date || "未填日期")}</p>
            <span>${escapeHtml(item.reason || "需追蹤")}</span>
          </article>
        `).join("") : '<p class="subtle">目前沒有需追蹤項目。</p>';
      }

      function renderPriorities(groups) {
        renderPriorityList("priorityTodayList", groups.today, "today");
        renderPriorityList("priorityWeekList", groups.week, "warning");
        renderPriorityList("priorityOverdueList", groups.overdue, "critical");
        renderPriorityList("priorityReminderList", groups.reminder, "reminder");
      }

      function renderPriorityList(id, items, level) {
        $(id).innerHTML = items.length ? items.slice(0, 10).map((item) => `
          <article class="item ${level}">
            <strong>${escapeHtml(item.project)} / ${escapeHtml(item.title || "未命名")}</strong>
            <p>${escapeHtml(item.type)} / ${escapeHtml(item.assignee || "未指定")} / ${escapeHtml(item.date || "未填日期")}</p>
            <span>${escapeHtml(item.reason || "需追蹤")}</span>
          </article>
        `).join("") : '<p class="subtle">目前沒有項目。</p>';
      }

      function renderIssues(items) {
        $("issueList").innerHTML = items.length ? items.map((item) => `
          <article class="item ${item.level}">
            <strong>${escapeHtml(item.project)} / ${escapeHtml(item.title)}</strong>
            <p>${escapeHtml(item.detail || "")}</p>
          </article>
        `).join("") : '<p class="subtle">目前沒有資料品質提醒。</p>';
      }

      function renderPeople(people) {
        $("peopleRows").innerHTML = people.length ? people.map((person) => `
          <tr>
            <td>${escapeHtml(person.name)}</td>
            <td>${escapeHtml(person.projects)}</td>
            <td>${formatNumber(person.total)}</td>
            <td>${formatNumber(person.recentUpdates)}</td>
            <td>${formatNumber(person.needsFollowUp)}</td>
            <td>${escapeHtml(person.latestDate || "尚無紀錄")}</td>
          </tr>
        `).join("") : '<tr><td colspan="6">目前沒有同仁資料。</td></tr>';
      }

      function renderWorkload(items) {
        $("workloadGrid").innerHTML = items.length ? items.slice(0, 24).map((person) => `
          <article class="workload-card ${person.level}">
            <div class="project-head">
              <div>
                <h3>${escapeHtml(person.name)}</h3>
                <p class="subtle">${escapeHtml(person.projects || "")}</p>
              </div>
              <span class="status-dot ${person.level === "high" ? "red" : person.level === "medium" ? "yellow" : "green"}">分數 ${formatNumber(person.score)}</span>
            </div>
            <div class="mini-grid">
              ${mini("未完成工項", person.openItems)}
              ${mini("未完成案件", person.openCases)}
              ${mini("本月輔導", person.consultationsThisMonth)}
              ${mini("需追蹤", person.needsFollowUp)}
            </div>
          </article>
        `).join("") : '<p class="subtle">目前沒有工作量資料。</p>';
      }

      function renderAssignmentProjects(projects) {
        const select = $("assignmentProjectInput");
        const current = select.value;
        select.innerHTML = projects.map((project) => `<option value="${escapeHtml(project.id)}">${escapeHtml(project.name)}</option>`).join("");
        if (projects.some((project) => project.id === current)) select.value = current;
      }

      function renderAssignmentPeople(people) {
        const names = [...new Set((people || [])
          .map((person) => person.name)
          .filter((name) => name && name !== "未指定"))]
          .sort((a, b) => a.localeCompare(b, "zh-Hant"));
        $("assignmentAssigneeOptions").innerHTML = names.map((name) => `<option value="${escapeHtml(name)}"></option>`).join("");
      }

      function renderReviewFilters(payload) {
        setSelectOptions("reviewProjectFilter", payload.projects.map((project) => ({
          value: project.id,
          label: project.name,
        })), "全部專案", reviewFilters.projectId);
        setSelectOptions("reviewAssigneeFilter", uniqueOptions((payload.reviewQueue || []).map((item) => item.assignee)), "全部同仁", reviewFilters.assignee);
        setSelectOptions("reviewStatusFilter", uniqueOptions((payload.reviewQueue || []).map((item) => item.status)), "全部狀態", reviewFilters.status);
        setSelectOptions("reviewPriorityFilter", uniqueOptions((payload.reviewQueue || []).map((item) => item.priority)), "全部優先序", reviewFilters.priority);
      }

      function updateReviewFilters() {
        reviewFilters.projectId = $("reviewProjectFilter").value;
        reviewFilters.assignee = $("reviewAssigneeFilter").value;
        reviewFilters.status = $("reviewStatusFilter").value;
        reviewFilters.priority = $("reviewPriorityFilter").value;
        renderReviewQueue();
      }

      function renderReviewQueue() {
        const items = filterReviewQueue(dashboardData ? dashboardData.reviewQueue || [] : []);
        $("reviewCountText").textContent = `目前顯示 ${formatNumber(items.length)} 筆，依查核急迫性排序。`;
        $("reviewRows").innerHTML = items.length ? items.map((item) => `
          <tr>
            <td><span class="badge ${escapeHtml(item.level || "reminder")}">${escapeHtml(item.reason || "需查核")}</span></td>
            <td>${escapeHtml(item.office || item.project || "")}</td>
            <td>
              <strong>${escapeHtml(item.caseId || "")}</strong>
              <p class="subtle">${escapeHtml(item.title || "未命名案件")}</p>
            </td>
            <td>${escapeHtml(item.assignee || "未指定")}</td>
            <td>${escapeHtml(item.status || "未填")}</td>
            <td>${escapeHtml(item.deadline || "未填")}</td>
            <td>
              ${escapeHtml(item.reportedAt || "尚無紀錄")}
              <p class="subtle">${escapeHtml(item.reporter || "")}</p>
            </td>
            <td class="text-cell">${escapeHtml(shortText(item.progress || item.completion || "", 90))}</td>
            <td>
              <div class="link-row">
                <a class="button" href="${escapeHtml(item.pageUrl || "#")}" target="_blank" rel="noreferrer">專案頁</a>
                <a class="button" href="${escapeHtml(item.spreadsheetUrl || "#")}" target="_blank" rel="noreferrer">底表</a>
              </div>
            </td>
            <td>
              <div class="action-row">
                <button class="button compact" type="button" data-review-action="approve" data-project-id="${escapeHtml(item.projectId || "")}" data-case-id="${escapeHtml(item.caseId || "")}">通過</button>
                <button class="button compact" type="button" data-review-action="return" data-project-id="${escapeHtml(item.projectId || "")}" data-case-id="${escapeHtml(item.caseId || "")}">退回</button>
                <button class="button compact" type="button" data-review-action="comment" data-project-id="${escapeHtml(item.projectId || "")}" data-case-id="${escapeHtml(item.caseId || "")}">意見</button>
                <button class="button compact" type="button" data-review-action="extend" data-project-id="${escapeHtml(item.projectId || "")}" data-case-id="${escapeHtml(item.caseId || "")}">延長</button>
              </div>
            </td>
          </tr>
        `).join("") : '<tr><td colspan="10">目前沒有符合條件的待查核案件。</td></tr>';
      }

      function handleReviewActionClick(event) {
        const button = event.target.closest("[data-review-action]");
        if (!button) return;
        const item = (dashboardData && dashboardData.reviewQueue || []).find((entry) => (
          entry.projectId === button.dataset.projectId && entry.caseId === button.dataset.caseId
        ));
        if (!item) {
          setMessage("reviewActionMessage", "找不到這筆案件，請重新整理後再試。", "error");
          return;
        }
        const payload = buildReviewPayload(button.dataset.reviewAction, item);
        if (!payload) return;
        const label = reviewActionLabel(payload.action);
        if (!window.confirm(`確認${label}？\n\n${item.project}\n${item.caseId} ${item.title || ""}`)) return;
        setReviewButtonsDisabled(true);
        setMessage("reviewActionMessage", `${label}寫入中...`, "");
        google.script.run
          .withSuccessHandler((result) => {
            setReviewButtonsDisabled(false);
            if (!result || result.ok === false) {
              setMessage("reviewActionMessage", result && result.error ? result.error : `${label}失敗`, "error");
              return;
            }
            setMessage("reviewActionMessage", result.message || `${label}完成`, "success");
            loadDashboard();
          })
          .withFailureHandler((error) => {
            setReviewButtonsDisabled(false);
            setMessage("reviewActionMessage", error && error.message ? error.message : `${label}失敗`, "error");
          })
          .reviewCaseAction(payload);
      }

      function buildReviewPayload(action, item) {
        let comment = "";
        let deadline = "";
        if (action === "approve") {
          comment = window.prompt("查核通過說明，可留空：", item.completion || item.progress || "");
          if (comment === null) return null;
          comment = comment.trim();
        } else if (action === "return") {
          comment = window.prompt("請填寫退回補件原因或補件要求：", "");
          if (comment === null) return null;
          comment = comment.trim();
          if (!comment) {
            setMessage("reviewActionMessage", "退回補件請填寫原因或要求。", "error");
            return null;
          }
        } else if (action === "comment") {
          comment = window.prompt("請填寫主管意見：", "");
          if (comment === null) return null;
          comment = comment.trim();
          if (!comment) {
            setMessage("reviewActionMessage", "請填寫主管意見。", "error");
            return null;
          }
        } else if (action === "extend") {
          deadline = window.prompt("請填寫新 Deadline，例：2026-06-10 17:00", item.deadline || "");
          if (deadline === null) return null;
          deadline = deadline.trim();
          if (!deadline) {
            setMessage("reviewActionMessage", "延長 Deadline 請填寫新期限。", "error");
            return null;
          }
          comment = (window.prompt("延長原因或提醒，可留空：", "") || "").trim();
        }
        return {
          projectId: item.projectId,
          caseId: item.caseId,
          action,
          comment,
          deadline,
        };
      }

      function reviewActionLabel(action) {
        return {
          approve: "查核通過",
          return: "退回補件",
          comment: "加註主管意見",
          extend: "延長 Deadline",
        }[action] || "主管查核";
      }

      function setReviewButtonsDisabled(disabled) {
        document.querySelectorAll("[data-review-action]").forEach((button) => {
          button.disabled = disabled;
        });
      }

      function filterReviewQueue(items) {
        return items.filter((item) => {
          if (reviewFilters.projectId && item.projectId !== reviewFilters.projectId) return false;
          if (reviewFilters.assignee && item.assignee !== reviewFilters.assignee) return false;
          if (reviewFilters.status && item.status !== reviewFilters.status) return false;
          if (reviewFilters.priority && item.priority !== reviewFilters.priority) return false;
          return true;
        });
      }

      function setSelectOptions(id, options, allLabel, currentValue) {
        const select = $(id);
        const normalized = options.filter((option) => option.value);
        const hasCurrent = !currentValue || normalized.some((option) => option.value === currentValue);
        const selectedValue = hasCurrent ? currentValue : "";
        select.innerHTML = [
          `<option value="">${escapeHtml(allLabel)}</option>`,
          ...normalized.map((option) => `<option value="${escapeHtml(option.value)}">${escapeHtml(option.label)}</option>`),
        ].join("");
        select.value = selectedValue;
      }

      function uniqueOptions(values) {
        return [...new Set(values.filter(Boolean))]
          .sort((a, b) => a.localeCompare(b, "zh-Hant"))
          .map((value) => ({ value, label: value }));
      }

      function renderReminder(payload) {
        const emailText = payload.reminderStatus.emailEnabled ? "Email 已啟用" : "Email 未設定";
        const lineText = payload.reminderStatus.lineEnabled ? "LINE 已啟用" : "LINE 尚未設定 webhook";
        $("reminderStatus").textContent = `${emailText} / ${lineText}`;
        $("reminderText").value = payload.reminderText || "";
        const items = [
          ...(payload.priorities.today || []).slice(0, 4),
          ...(payload.priorities.overdue || []).slice(0, 4),
          ...(payload.priorities.week || []).slice(0, 4),
        ];
        $("reminderPreview").innerHTML = items.length ? items.map((item) => `
          <article class="item ${item.reason === "已逾期" ? "critical" : item.reason === "今日到期" ? "today" : "warning"}">
            <strong>${escapeHtml(item.project)} / ${escapeHtml(item.title || "未命名")}</strong>
            <p>${escapeHtml(item.assignee || "未指定")} / ${escapeHtml(item.reason || "")}</p>
          </article>
        `).join("") : '<p class="subtle">目前沒有高優先提醒。</p>';
      }

      function submitAssignment(event) {
        event.preventDefault();
        const payload = {
          projectId: $("assignmentProjectInput").value,
          assignee: $("assignmentAssigneeInput").value.trim(),
          title: $("assignmentTitleInput").value.trim(),
          deadline: $("assignmentDeadlineInput").value,
          priority: $("assignmentPriorityInput").value,
          status: $("assignmentStatusInput").value,
          instruction: $("assignmentInstructionInput").value.trim(),
          checkpoint: $("assignmentCheckpointInput").value.trim(),
          note: $("assignmentNoteInput").value.trim(),
          attachment: $("assignmentAttachmentInput").value.trim(),
        };
        if (!payload.projectId || !payload.assignee || !payload.title || !payload.deadline || !payload.instruction) {
          setMessage("assignmentMessage", "請填寫專案、指定同事、案件名稱、Deadline 與交辦內容。", "error");
          return;
        }
        if (!window.confirm(`確認送出交辦？\n\n案件：${payload.title}\n指定同事：${payload.assignee}\nDeadline：${payload.deadline}`)) return;
        $("assignmentSubmitButton").disabled = true;
        setMessage("assignmentMessage", "送出中...", "");
        google.script.run
          .withSuccessHandler((result) => {
            $("assignmentSubmitButton").disabled = false;
            if (!result || result.ok === false) {
              setMessage("assignmentMessage", result && result.error ? result.error : "送出失敗", "error");
              return;
            }
            setMessage("assignmentMessage", `已新增交辦：${result.caseId}`, "success");
            $("assignmentForm").reset();
            loadDashboard();
          })
          .withFailureHandler((error) => {
            $("assignmentSubmitButton").disabled = false;
            setMessage("assignmentMessage", error && error.message ? error.message : "送出失敗", "error");
          })
          .createAssignment(payload);
      }

      function sendReminderDigest() {
        if (!dashboardData) {
          setMessage("reminderMessage", "資料尚未讀取完成。", "error");
          return;
        }
        if (!window.confirm("確認寄出公司專案提醒摘要？")) return;
        $("sendReminderButton").disabled = true;
        setMessage("reminderMessage", "寄送中...", "");
        google.script.run
          .withSuccessHandler((result) => {
            $("sendReminderButton").disabled = false;
            if (!result || result.ok === false) {
              setMessage("reminderMessage", result && result.error ? result.error : "寄送失敗", "error");
              return;
            }
            setMessage("reminderMessage", `已寄出 Email：${(result.emailRecipients || []).join("、")}${result.lineSent ? "；LINE 已送出" : ""}`, "success");
          })
          .withFailureHandler((error) => {
            $("sendReminderButton").disabled = false;
            setMessage("reminderMessage", error && error.message ? error.message : "寄送失敗", "error");
          })
          .sendReminderDigest();
      }

      async function copyReminderText() {
        const text = $("reminderText").value;
        if (!text) {
          setMessage("reminderMessage", "目前沒有可複製的提醒摘要。", "error");
          return;
        }
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(text);
          } else {
            $("reminderText").select();
            document.execCommand("copy");
          }
          setMessage("reminderMessage", "已複製提醒摘要。", "success");
        } catch (error) {
          setMessage("reminderMessage", "複製失敗，請直接選取摘要文字。", "error");
        }
      }

      function setMessage(id, text, type) {
        const element = $(id);
        element.textContent = text;
        element.className = `message ${type || ""}`;
      }

      function mini(label, value) {
        return `<div class="mini"><span>${escapeHtml(label)}</span><strong>${formatNumber(value)}</strong></div>`;
      }

      function formatNumber(value) {
        if (typeof value === "number") return value.toLocaleString("zh-TW");
        return value == null ? "0" : String(value);
      }

      function shortText(value, maxLength) {
        const text = String(value || "").trim();
        if (text.length <= maxLength) return text || "未填";
        return `${text.slice(0, maxLength)}...`;
      }

      function escapeHtml(value) {
        return String(value == null ? "" : value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }
    </script>
  </body>
</html>
