<!doctype html>
<html lang="zh-Hant">
  <head>
    <base target="_top" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f7f8;
        --panel: #ffffff;
        --ink: #17202a;
        --muted: #667085;
        --line: #d8dee8;
        --brand: #1f6f78;
        --brand-dark: #15535a;
        --red: #b8321f;
        --yellow: #9a6512;
        --green: #1f7a4d;
        --shadow: 0 10px 28px rgba(25, 38, 52, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
        line-height: 1.5;
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 5;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        padding: 20px 26px;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
      }

      h1,
      h2,
      h3,
      p {
        margin: 0;
      }

      h1 {
        font-size: 26px;
        font-weight: 780;
      }

      h2 {
        font-size: 18px;
      }

      h3 {
        font-size: 15px;
      }

      .eyebrow {
        color: var(--brand);
        font-size: 13px;
        font-weight: 800;
        margin-bottom: 4px;
      }

      .subtle {
        color: var(--muted);
        font-size: 13px;
      }

      .button {
        border: 1px solid var(--brand);
        border-radius: 6px;
        background: #ffffff;
        color: var(--brand);
        padding: 9px 12px;
        min-height: 38px;
        font: inherit;
        font-size: 14px;
        font-weight: 760;
        text-decoration: none;
        cursor: pointer;
      }

      .button:hover {
        background: #edf7f8;
      }

      .button.primary {
        background: var(--brand);
        color: #ffffff;
      }

      .button.compact {
        min-height: 30px;
        padding: 5px 8px;
        font-size: 12px;
      }

      .button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .button.active {
        background: var(--brand);
        color: #ffffff;
      }

      .top-actions {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }

      .filter-row {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }

      .layout {
        width: min(1440px, 100%);
        margin: 0 auto;
        padding: 22px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .summary-grid {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 1px;
        margin-bottom: 16px;
      }

      .metric {
        padding: 16px;
        background: #ffffff;
      }

      .metric span {
        display: block;
        color: var(--muted);
        font-size: 13px;
        margin-bottom: 6px;
      }

      .metric strong {
        font-size: 24px;
      }

      .project-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
        margin-bottom: 16px;
      }

      .project-card {
        display: grid;
        gap: 12px;
        padding: 14px;
      }

      .project-card.red {
        border-color: #d14b32;
      }

      .project-card.yellow {
        border-color: #e6b04a;
      }

      .project-card.green {
        border-color: #b8dcc9;
      }

      .project-head {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: flex-start;
      }

      .status-dot {
        display: inline-flex;
        align-items: center;
        min-height: 24px;
        border-radius: 999px;
        padding: 3px 9px;
        font-size: 12px;
        font-weight: 800;
      }

      .status-dot.red {
        background: #feece8;
        color: var(--red);
      }

      .status-dot.yellow {
        background: #fff4df;
        color: var(--yellow);
      }

      .status-dot.green {
        background: #e8f5ee;
        color: var(--green);
      }

      .mini-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 8px;
      }

      .mini {
        display: grid;
        gap: 3px;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: #fbfcfd;
      }

      .mini span {
        color: var(--muted);
        font-size: 12px;
      }

      .mini strong {
        font-size: 18px;
      }

      .dashboard-grid {
        display: grid;
        grid-template-columns: minmax(360px, 1fr) minmax(360px, 1fr);
        gap: 16px;
      }

      .priority-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
        margin-bottom: 16px;
      }

      .block {
        display: grid;
        gap: 12px;
        padding: 14px;
      }

      .list {
        display: grid;
        gap: 9px;
        max-height: 560px;
        overflow: auto;
      }

      .item {
        display: grid;
        gap: 5px;
        padding: 11px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: #fbfcfd;
      }

      .item strong {
        font-size: 14px;
      }

      .item p,
      .item span {
        color: var(--muted);
        font-size: 13px;
      }

      .item.critical {
        border-color: #d14b32;
        background: #fffafa;
      }

      .item.warning {
        border-color: #e6b04a;
        background: #fffaf1;
      }

      .item.today {
        border-color: #d8841b;
        background: #fffaf1;
      }

      .item.reminder {
        border-color: var(--line);
      }

      .workload-grid,
      .people-status-grid,
      .assignment-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .workload-card {
        display: grid;
        gap: 8px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: #fbfcfd;
      }

      .workload-card.high {
        border-color: #d14b32;
        background: #fffafa;
      }

      .workload-card.medium {
        border-color: #e6b04a;
        background: #fffaf1;
      }

      .people-status-card {
        display: grid;
        gap: 10px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: #fbfcfd;
      }

      .people-status-card.high {
        border-color: #d14b32;
        background: #fffafa;
      }

      .people-status-card.medium {
        border-color: #e6b04a;
        background: #fffaf1;
      }

      .status-metrics {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 8px;
      }

      .status-reasons {
        color: var(--muted);
        font-size: 13px;
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      label {
        display: grid;
        gap: 6px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 760;
      }

      input,
      select,
      textarea {
        width: 100%;
        border: 1px solid #cbd3df;
        border-radius: 6px;
        padding: 10px 11px;
        background: #ffffff;
        color: var(--ink);
        font: inherit;
      }

      textarea {
        resize: vertical;
      }

      .message {
        min-height: 20px;
        color: var(--muted);
        font-size: 13px;
      }

      .message.success {
        color: var(--green);
      }

      .message.error {
        color: var(--red);
      }

      .notice {
        padding: 10px 11px;
        border: 1px solid #f0b5a7;
        border-radius: 7px;
        background: #fffafa;
        color: var(--red);
        font-size: 13px;
      }

      .reminder-textarea {
        min-height: 280px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        font-size: 13px;
        white-space: pre;
      }

      .report-controls {
        display: flex;
        gap: 10px;
        align-items: flex-end;
        flex-wrap: wrap;
      }

      .report-controls label {
        min-width: 180px;
      }

      .report-textarea {
        min-height: 420px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        font-size: 13px;
        white-space: pre;
      }

      .report-note {
        min-height: 88px;
      }

      .people-table {
        width: 100%;
        border-collapse: collapse;
        min-width: 640px;
      }

      .review-table {
        width: 100%;
        border-collapse: collapse;
        min-width: 1280px;
      }

      .review-filters {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
      }

      .text-cell {
        max-width: 320px;
        color: var(--muted);
      }

      .link-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .action-row {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        min-width: 180px;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        min-height: 24px;
        border-radius: 999px;
        padding: 3px 9px;
        font-size: 12px;
        font-weight: 800;
        white-space: nowrap;
      }

      .badge.critical {
        background: #feece8;
        color: var(--red);
      }

      .badge.warning,
      .badge.today {
        background: #fff4df;
        color: var(--yellow);
      }

      .badge.notice,
      .badge.reminder {
        background: #edf2f7;
        color: var(--muted);
      }

      .table-wrap {
        overflow: auto;
      }

      th,
      td {
        padding: 10px 11px;
        border-bottom: 1px solid var(--line);
        text-align: left;
        font-size: 13px;
        vertical-align: top;
      }

      th {
        color: var(--muted);
        background: #f6f8fb;
        font-weight: 800;
      }

      .auth-panel {
        display: grid;
        gap: 10px;
        padding: 28px;
        margin: 22px auto;
        width: min(720px, calc(100% - 32px));
      }

      .hidden {
        display: none;
      }

      @media (max-width: 980px) {
        .topbar {
          align-items: stretch;
          flex-direction: column;
        }

        .summary-grid,
        .project-grid,
        .dashboard-grid,
        .mini-grid,
        .priority-grid,
        .workload-grid,
        .people-status-grid,
        .status-metrics,
        .assignment-grid,
        .review-filters,
        .form-grid {
          grid-template-columns: 1fr;
        }

        .layout {
          padding: 14px;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">公司營運管理</p>
        <h1>公司專案總控台</h1>
        <p id="metaText" class="subtle">讀取中</p>
      </div>
      <div class="top-actions">
        <button id="sendReminderButton" class="button" type="button">寄出提醒</button>
        <button id="refreshButton" class="button primary" type="button">重新整理</button>
      </div>
    </header>

    <section id="authPanel" class="panel auth-panel hidden">
      <h2>無法進入公司總控台</h2>
      <p id="authMessage" class="subtle"></p>
    </section>

    <main id="dashboard" class="layout hidden">
      <section id="summaryGrid" class="panel summary-grid" aria-label="公司摘要"></section>
      <section id="projectGrid" class="project-grid" aria-label="專案狀態"></section>
      <section class="priority-grid" aria-label="待辦優先序">
        <section class="panel block">
          <h2>今天必追</h2>
          <div id="priorityTodayList" class="list"></div>
        </section>
        <section class="panel block">
          <h2>本週需追</h2>
          <div id="priorityWeekList" class="list"></div>
        </section>
        <section class="panel block">
          <h2>逾期</h2>
          <div id="priorityOverdueList" class="list"></div>
        </section>
        <section class="panel block">
          <h2>提醒</h2>
          <div id="priorityReminderList" class="list"></div>
        </section>
      </section>
      <section id="reviewPanel" class="panel block" aria-label="主管待查核清單">
        <div class="project-head">
          <div>
            <h2>主管待查核清單</h2>
            <p id="reviewCountText" class="subtle"></p>
          </div>
          <div class="top-actions">
            <button id="copyReviewQueueButton" class="button compact" type="button">複製目前清單</button>
          </div>
        </div>
        <div class="review-filters">
          <label>
            <span>專案</span>
            <select id="reviewProjectFilter"></select>
          </label>
          <label>
            <span>同仁</span>
            <select id="reviewAssigneeFilter"></select>
          </label>
          <label>
            <span>狀態</span>
            <select id="reviewStatusFilter"></select>
          </label>
          <label>
            <span>優先序</span>
            <select id="reviewPriorityFilter"></select>
          </label>
        </div>
        <p id="reviewActionMessage" class="message" role="status"></p>
        <div class="table-wrap">
          <table class="review-table">
            <thead>
              <tr>
                <th>查核原因</th>
                <th>專案</th>
                <th>案件</th>
                <th>同仁</th>
                <th>狀態</th>
                <th>Deadline</th>
                <th>最近回報</th>
                <th>最新進度</th>
                <th>連結</th>
                <th>主管動作</th>
              </tr>
            </thead>
            <tbody id="reviewRows"></tbody>
          </table>
        </div>
      </section>
      <section class="panel block" aria-label="週報月報產生器">
        <div class="project-head">
          <div>
            <h2>週報 / 月報產生器</h2>
            <p class="subtle">依目前總控台資料產生可貼到會議紀錄、Email 或月報的文字摘要。</p>
          </div>
        </div>
        <div class="report-controls">
          <label>
            <span>報告類型</span>
            <select id="reportTypeInput">
              <option value="weekly">週報</option>
              <option value="monthly">月報</option>
            </select>
          </label>
          <label>
            <span>報告期間</span>
            <input id="reportPeriodInput" type="text" />
          </label>
          <button id="refreshReportButton" class="button" type="button">重新產生</button>
          <button id="copyReportButton" class="button primary" type="button">複製報告</button>
          <button id="downloadReportButton" class="button" type="button">下載文字檔</button>
        </div>
        <label>
          <span>主管補充重點</span>
          <textarea id="reportNoteInput" class="report-note" rows="3" placeholder="可填入本週決策、下週重點、需跨部門協調事項"></textarea>
        </label>
        <textarea id="reportText" class="report-textarea" readonly></textarea>
        <p id="reportMessage" class="message" role="status"></p>
      </section>
      <section class="dashboard-grid">
        <section class="panel block">
          <h2>主管交辦中心</h2>
          <form id="assignmentForm" class="assignment-grid">
            <label>
              <span>專案</span>
              <select id="assignmentProjectInput" required></select>
            </label>
            <label>
              <span>指定同事</span>
              <input id="assignmentAssigneeInput" type="text" list="assignmentAssigneeOptions" required placeholder="輸入同仁姓名" />
              <datalist id="assignmentAssigneeOptions"></datalist>
            </label>
            <label>
              <span>案件名稱</span>
              <input id="assignmentTitleInput" type="text" required placeholder="例：成果資料補件追蹤" />
            </label>
            <label>
              <span>Deadline</span>
              <input id="assignmentDeadlineInput" type="datetime-local" required />
            </label>
            <label>
              <span>優先序</span>
              <select id="assignmentPriorityInput">
                <option value="一般">一般</option>
                <option value="高">高</option>
                <option value="急件">急件</option>
              </select>
            </label>
            <label>
              <span>狀態</span>
              <select id="assignmentStatusInput">
                <option value="待執行">待執行</option>
                <option value="進行中">進行中</option>
                <option value="待查核">待查核</option>
              </select>
            </label>
            <label style="grid-column: 1 / -1">
              <span>交辦內容</span>
              <textarea id="assignmentInstructionInput" rows="4" required placeholder="請寫清楚交辦事項、交付格式、需要協調的人或資料"></textarea>
            </label>
            <label style="grid-column: 1 / -1">
              <span>查核點</span>
              <textarea id="assignmentCheckpointInput" rows="3" placeholder="例：週三前回報初稿；週五前補齊佐證"></textarea>
            </label>
            <label style="grid-column: 1 / -1">
              <span>備註</span>
              <input id="assignmentNoteInput" type="text" placeholder="補充提醒、檔案位置或主管查核意見" />
            </label>
            <label style="grid-column: 1 / -1">
              <span>佐證資料連結</span>
              <input id="assignmentAttachmentInput" type="url" placeholder="貼上雲端資料夾、文件或成果連結" />
            </label>
            <p id="assignmentMessage" class="message" role="status"></p>
            <button id="assignmentSubmitButton" class="button primary" type="submit">送出交辦</button>
          </form>
        </section>
        <section class="panel block">
          <h2>提醒中心</h2>
          <p id="reminderStatus" class="subtle"></p>
          <div class="top-actions">
            <button id="copyReminderButton" class="button" type="button">複製摘要</button>
          </div>
          <textarea id="reminderText" class="reminder-textarea" readonly></textarea>
          <div id="reminderPreview" class="list"></div>
          <p id="reminderMessage" class="message" role="status"></p>
        </section>
        <section class="panel block">
          <h2>今日需追蹤</h2>
          <div id="followUpList" class="list"></div>
        </section>
        <section class="panel block">
          <h2>資料品質提醒</h2>
          <div id="issueList" class="list"></div>
        </section>
        <section class="panel block" style="grid-column: 1 / -1">
          <div class="project-head">
            <div>
              <h2>同仁回報提醒</h2>
              <p id="peopleStatusCountText" class="subtle"></p>
            </div>
            <div id="peopleStatusFilters" class="filter-row" aria-label="同仁回報提醒篩選">
              <button class="button compact active" type="button" data-people-status-filter="all">全部</button>
              <button class="button compact" type="button" data-people-status-filter="high">今天要追</button>
              <button class="button compact" type="button" data-people-status-filter="medium">本週追蹤</button>
              <button class="button compact" type="button" data-people-status-filter="updated">有更新</button>
              <button id="copyPeopleStatusButton" class="button compact" type="button">複製目前名單</button>
            </div>
          </div>
          <div id="peopleStatusGrid" class="people-status-grid"></div>
        </section>
        <section class="panel block" style="grid-column: 1 / -1">
          <h2>同仁工作量看板</h2>
          <div id="workloadGrid" class="workload-grid"></div>
        </section>
        <section class="panel block" style="grid-column: 1 / -1">
          <h2>同仁更新狀態</h2>
          <div class="table-wrap">
            <table class="people-table">
              <thead>
                <tr>
                  <th>同仁</th>
                  <th>專案</th>
                  <th>負責工項</th>
                  <th>近 7 日更新</th>
                  <th>需追蹤</th>
                  <th>最近更新</th>
                </tr>
              </thead>
              <tbody id="peopleRows"></tbody>
            </table>
          </div>
        </section>
      </section>
    </main>

    <script>
      const initialAuth = <?!= initialAuth ?>;
      const $ = (id) => document.getElementById(id);
      let dashboardData = null;
      const reviewFilters = {
        projectId: "",
        assignee: "",
        status: "",
        priority: "",
      };
      let peopleStatusFilter = "all";

      $("refreshButton").addEventListener("click", loadDashboard);
      $("sendReminderButton").addEventListener("click", sendReminderDigest);
      $("copyReminderButton").addEventListener("click", copyReminderText);
      $("assignmentForm").addEventListener("submit", submitAssignment);
      $("reviewProjectFilter").addEventListener("change", updateReviewFilters);
      $("reviewAssigneeFilter").addEventListener("change", updateReviewFilters);
      $("reviewStatusFilter").addEventListener("change", updateReviewFilters);
      $("reviewPriorityFilter").addEventListener("change", updateReviewFilters);
      $("reviewRows").addEventListener("click", handleReviewActionClick);
      $("copyReviewQueueButton").addEventListener("click", copyCurrentReviewQueue);
      $("reportTypeInput").addEventListener("change", handleReportTypeChange);
      $("reportPeriodInput").addEventListener("input", renderReport);
      $("reportNoteInput").addEventListener("input", renderReport);
      $("refreshReportButton").addEventListener("click", renderReport);
      $("copyReportButton").addEventListener("click", copyReportText);
      $("downloadReportButton").addEventListener("click", downloadReportText);
      $("peopleStatusFilters").addEventListener("click", handlePeopleStatusFilterClick);
      $("peopleStatusGrid").addEventListener("click", handlePeopleStatusActionClick);
      $("copyPeopleStatusButton").addEventListener("click", copyCurrentPeopleStatusList);
      loadDashboard();

      function loadDashboard() {
        $("refreshButton").disabled = true;
        $("refreshButton").textContent = "讀取中";
        google.script.run
          .withSuccessHandler((payload) => {
            $("refreshButton").disabled = false;
            $("refreshButton").textContent = "重新整理";
            if (!payload || payload.ok === false) {
              renderAuth(payload && payload.auth ? payload.auth : initialAuth, payload && payload.error);
              return;
            }
            renderDashboard(payload);
          })
          .withFailureHandler((error) => {
            $("refreshButton").disabled = false;
            $("refreshButton").textContent = "重新整理";
            renderAuth(initialAuth, error && error.message ? error.message : "讀取資料失敗");
          })
          .getDashboardData();
      }

      function renderAuth(auth, error) {
        $("dashboard").classList.add("hidden");
        $("authPanel").classList.remove("hidden");
        $("authMessage").textContent = error || (auth && auth.message) || "此帳號未授權。";
        $("metaText").textContent = auth && auth.email ? `目前帳號：${auth.email}` : "請使用已授權的 Google 帳號登入。";
      }

      function renderDashboard(payload) {
        dashboardData = payload;
        $("authPanel").classList.add("hidden");
        $("dashboard").classList.remove("hidden");
        $("metaText").textContent = `登入帳號：${payload.viewer} / 資料時間：${payload.generatedAt}`;
        renderSummary(payload.totals);
        renderProjects(payload.projects);
        renderAssignmentProjects(payload.projects);
        renderAssignmentPeople(payload.workload);
        renderReviewFilters(payload);
        renderReviewQueue();
        renderPriorities(payload.priorities);
        renderFollowUps(payload.followUps);
        renderIssues(payload.issues);
        renderReminder(payload);
        renderReport();
        renderPeopleStatus(payload.peopleStatus || []);
        renderWorkload(payload.workload);
        renderPeople(payload.people);
      }

      function renderSummary(totals) {
        const metrics = [
          ["專案數", totals.projects],
          ["紅燈", totals.redProjects],
          ["黃燈", totals.yellowProjects],
          ["待追蹤工項", totals.needsFollowUp],
          ["未完成案件", totals.openCases],
          ["本月輔導", totals.consultationsThisMonth],
        ];
        $("summaryGrid").innerHTML = metrics.map(([label, value]) => (
          `<div class="metric"><span>${escapeHtml(label)}</span><strong>${formatNumber(value)}</strong></div>`
        )).join("");
      }

      function renderProjects(projects) {
        $("projectGrid").innerHTML = projects.map((project) => {
          const label = project.status === "red" ? "紅燈" : project.status === "yellow" ? "黃燈" : "綠燈";
          const errorBlock = project.error ? `<p class="notice">資料來源讀取失敗：${escapeHtml(project.error)}</p>` : "";
          return `
            <article class="panel project-card ${project.status}">
              <div class="project-head">
                <div>
                  <h2>${escapeHtml(project.name)}</h2>
                  <p class="subtle">資料時間：${escapeHtml(project.latestDataTime || "未記錄")}</p>
                </div>
                <span class="status-dot ${project.status}">${label}</span>
              </div>
              <div class="mini-grid">
                ${mini("工項", `${project.metrics.doneItems}/${project.metrics.items}`)}
                ${mini("需追蹤", project.metrics.needsFollowUp)}
                ${mini("未完成案件", project.metrics.openCases)}
                ${mini("本月輔導", project.metrics.consultationsThisMonth)}
              </div>
              ${errorBlock}
              <p class="subtle">逾期 ${project.metrics.overdueCases} / 待查核 ${project.metrics.awaitingReview} / 憑證缺漏 ${project.metrics.expensesMissingVoucher}</p>
              <div>
                <a class="button" href="${project.pageUrl}" target="_blank" rel="noreferrer">開啟專案頁</a>
                <a class="button" href="${project.spreadsheetUrl}" target="_blank" rel="noreferrer">開啟底表</a>
              </div>
            </article>
          `;
        }).join("");
      }

      function renderFollowUps(items) {
        $("followUpList").innerHTML = items.length ? items.map((item) => `
          <article class="item ${item.reason === "已逾期" ? "critical" : "warning"}">
            <strong>${escapeHtml(item.project)} / ${escapeHtml(item.type)} / ${escapeHtml(item.title || "未命名")}</strong>
            <p>${escapeHtml(item.assignee || "未指定")} / ${escapeHtml(item.status || "未填狀態")} / ${escapeHtml(item.date || "未填日期")}</p>
            <span>${escapeHtml(item.reason || "需追蹤")}</span>
          </article>
        `).join("") : '<p class="subtle">目前沒有需追蹤項目。</p>';
      }

      function renderPriorities(groups) {
        renderPriorityList("priorityTodayList", groups.today, "today");
        renderPriorityList("priorityWeekList", groups.week, "warning");
        renderPriorityList("priorityOverdueList", groups.overdue, "critical");
        renderPriorityList("priorityReminderList", groups.reminder, "reminder");
      }

      function renderPriorityList(id, items, level) {
        $(id).innerHTML = items.length ? items.slice(0, 10).map((item) => `
          <article class="item ${level}">
            <strong>${escapeHtml(item.project)} / ${escapeHtml(item.title || "未命名")}</strong>
            <p>${escapeHtml(item.type)} / ${escapeHtml(item.assignee || "未指定")} / ${escapeHtml(item.date || "未填日期")}</p>
            <span>${escapeHtml(item.reason || "需追蹤")}</span>
          </article>
        `).join("") : '<p class="subtle">目前沒有項目。</p>';
      }

      function renderIssues(items) {
        $("issueList").innerHTML = items.length ? items.map((item) => `
          <article class="item ${item.level}">
            <strong>${escapeHtml(item.project)} / ${escapeHtml(item.title)}</strong>
            <p>${escapeHtml(item.detail || "")}</p>
          </article>
        `).join("") : '<p class="subtle">目前沒有資料品質提醒。</p>';
      }

      function renderPeople(people) {
        $("peopleRows").innerHTML = people.length ? people.map((person) => `
          <tr>
            <td>${escapeHtml(person.name)}</td>
            <td>${escapeHtml(person.projects)}</td>
            <td>${formatNumber(person.total)}</td>
            <td>${formatNumber(person.recentUpdates)}</td>
            <td>${formatNumber(person.needsFollowUp)}</td>
            <td>${escapeHtml(person.latestDate || "尚無紀錄")}</td>
          </tr>
        `).join("") : '<tr><td colspan="6">目前沒有同仁資料。</td></tr>';
      }

      function renderWorkload(items) {
        $("workloadGrid").innerHTML = items.length ? items.slice(0, 24).map((person) => `
          <article class="workload-card ${person.level}">
            <div class="project-head">
              <div>
                <h3>${escapeHtml(person.name)}</h3>
                <p class="subtle">${escapeHtml(person.projects || "")}</p>
              </div>
              <span class="status-dot ${person.level === "high" ? "red" : person.level === "medium" ? "yellow" : "green"}">分數 ${formatNumber(person.score)}</span>
            </div>
            <div class="mini-grid">
              ${mini("未完成工項", person.openItems)}
              ${mini("未完成案件", person.openCases)}
              ${mini("本月輔導", person.consultationsThisMonth)}
              ${mini("需追蹤", person.needsFollowUp)}
            </div>
          </article>
        `).join("") : '<p class="subtle">目前沒有工作量資料。</p>';
      }

      function renderPeopleStatus(items) {
        const filtered = filterPeopleStatus(items);
        $("peopleStatusCountText").textContent = `目前顯示 ${formatNumber(filtered.length)} 位，點「查看待查核」可直接篩到同仁案件。`;
        $("peopleStatusGrid").innerHTML = filtered.length ? filtered.slice(0, 18).map((person) => {
          const dotClass = person.level === "high" ? "red" : person.level === "medium" ? "yellow" : "green";
          const reasonText = (person.reasons || []).length ? person.reasons.join("；") : "目前沒有高優先查核原因。";
          return `
            <article class="people-status-card ${escapeHtml(person.level || "normal")}">
              <div class="project-head">
                <div>
                  <h3>${escapeHtml(person.name)}</h3>
                  <p class="subtle">${escapeHtml(person.projects || "")}</p>
                </div>
                <span class="status-dot ${dotClass}">${escapeHtml(person.actionText || "持續觀察")}</span>
              </div>
              <div class="status-metrics">
                ${mini("近 7 日更新", person.recentUpdates)}
                ${mini("需追蹤工項", person.needsFollowUp)}
                ${mini("未完成案件", person.openCases)}
                ${mini("逾期案件", person.overdueCases)}
                ${mini("待查核", person.pendingReview)}
                ${mini("今日/3日到期", `${formatNumber(person.dueToday)}/${formatNumber(person.dueSoon)}`)}
              </div>
              <p class="status-reasons">${escapeHtml(reasonText)}</p>
              <div class="action-row">
                <button class="button compact" type="button" data-status-assignee="${escapeHtml(person.name)}">查看待查核</button>
                <button class="button compact" type="button" data-status-copy="${escapeHtml(person.name)}">複製提醒</button>
              </div>
            </article>
          `;
        }).join("") : '<p class="subtle">目前沒有同仁回報資料。</p>';
      }

      function filterPeopleStatus(items) {
        return (items || []).filter((person) => {
          if (peopleStatusFilter === "high") return person.level === "high";
          if (peopleStatusFilter === "medium") return person.level === "medium";
          if (peopleStatusFilter === "updated") return Number(person.recentUpdates || 0) > 0;
          return true;
        });
      }

      function handlePeopleStatusFilterClick(event) {
        const button = event.target.closest("[data-people-status-filter]");
        if (!button) return;
        peopleStatusFilter = button.dataset.peopleStatusFilter || "all";
        document.querySelectorAll("[data-people-status-filter]").forEach((item) => {
          item.classList.toggle("active", item === button);
        });
        renderPeopleStatus(dashboardData ? dashboardData.peopleStatus || [] : []);
      }

      async function handlePeopleStatusActionClick(event) {
        const copyButton = event.target.closest("[data-status-copy]");
        if (copyButton && dashboardData) {
          const name = copyButton.dataset.statusCopy || "";
          const person = (dashboardData.peopleStatus || []).find((item) => item.name === name);
          if (!person) return;
          try {
            await copyText(buildPersonReminder(person));
            $("peopleStatusCountText").textContent = `已複製 ${name} 的提醒文字，可貼到 LINE、Email 或工作群組。`;
          } catch (error) {
            $("peopleStatusCountText").textContent = "複製失敗，請改用瀏覽器手動選取。";
          }
          return;
        }
        const button = event.target.closest("[data-status-assignee]");
        if (!button || !dashboardData) return;
        const name = button.dataset.statusAssignee || "";
        reviewFilters.assignee = name;
        renderReviewFilters(dashboardData);
        renderReviewQueue();
        setMessage("reviewActionMessage", `已篩選 ${name} 的待查核案件。`, "success");
        $("reviewPanel").scrollIntoView({ behavior: "smooth", block: "start" });
      }

      function buildPersonReminder(person) {
        const reasons = (person.reasons || []).length
          ? person.reasons.map((reason) => `- ${reason}`).join("\n")
          : "- 目前沒有高優先查核原因，請確認最新進度是否已補齊。";
        return [
          `${person.name}，提醒一下目前專案回報狀態：`,
          `專案：${person.projects || "未標示"}`,
          `狀態：${person.actionText || "持續觀察"}`,
          `近 7 日更新：${formatNumber(person.recentUpdates)}，需追蹤工項：${formatNumber(person.needsFollowUp)}`,
          `未完成案件：${formatNumber(person.openCases)}，逾期案件：${formatNumber(person.overdueCases)}，待查核：${formatNumber(person.pendingReview)}`,
          `今日/3 日內到期：${formatNumber(person.dueToday)}/${formatNumber(person.dueSoon)}`,
          "待確認事項：",
          reasons,
          "請協助補上最新進度、完成說明或佐證資料，謝謝。",
        ].join("\n");
      }

      async function copyCurrentPeopleStatusList() {
        if (!dashboardData) {
          $("peopleStatusCountText").textContent = "資料尚未讀取完成。";
          return;
        }
        const people = filterPeopleStatus(dashboardData.peopleStatus || []).slice(0, 18);
        if (!people.length) {
          $("peopleStatusCountText").textContent = "目前篩選沒有可複製的同仁提醒。";
          return;
        }
        const title = peopleStatusFilterLabel();
        const text = [
          `公司專案回報提醒：${title}`,
          `產生時間：${dashboardData.generatedAt || ""}`,
          "",
          ...people.map((person, index) => buildPersonReminderSummary(person, index + 1)),
        ].join("\n");
        try {
          await copyText(text);
          $("peopleStatusCountText").textContent = `已複製「${title}」${formatNumber(people.length)} 位同仁提醒摘要。`;
        } catch (error) {
          $("peopleStatusCountText").textContent = "複製失敗，請改用逐筆複製。";
        }
      }

      function buildPersonReminderSummary(person, index) {
        const reasons = (person.reasons || []).length ? person.reasons.join("；") : "請確認最新進度是否已補齊";
        return [
          `${index}. ${person.name} / ${person.actionText || "持續觀察"} / ${person.projects || "未標示專案"}`,
          `   近7日更新 ${formatNumber(person.recentUpdates)}；需追蹤 ${formatNumber(person.needsFollowUp)}；未完成案件 ${formatNumber(person.openCases)}；逾期 ${formatNumber(person.overdueCases)}；待查核 ${formatNumber(person.pendingReview)}；今日/3日到期 ${formatNumber(person.dueToday)}/${formatNumber(person.dueSoon)}`,
          `   待確認：${reasons}`,
        ].join("\n");
      }

      function peopleStatusFilterLabel() {
        return {
          all: "全部",
          high: "今天要追",
          medium: "本週追蹤",
          updated: "有更新",
        }[peopleStatusFilter] || "全部";
      }

      function renderAssignmentProjects(projects) {
        const select = $("assignmentProjectInput");
        const current = select.value;
        select.innerHTML = projects.map((project) => `<option value="${escapeHtml(project.id)}">${escapeHtml(project.name)}</option>`).join("");
        if (projects.some((project) => project.id === current)) select.value = current;
      }

      function renderAssignmentPeople(people) {
        const names = [...new Set((people || [])
          .map((person) => person.name)
          .filter((name) => name && name !== "未指定"))]
          .sort((a, b) => a.localeCompare(b, "zh-Hant"));
        $("assignmentAssigneeOptions").innerHTML = names.map((name) => `<option value="${escapeHtml(name)}"></option>`).join("");
      }

      function renderReviewFilters(payload) {
        setSelectOptions("reviewProjectFilter", payload.projects.map((project) => ({
          value: project.id,
          label: project.name,
        })), "全部專案", reviewFilters.projectId);
        setSelectOptions("reviewAssigneeFilter", uniqueOptions((payload.reviewQueue || []).flatMap((item) => splitClientNames(item.assignee))), "全部同仁", reviewFilters.assignee);
        setSelectOptions("reviewStatusFilter", uniqueOptions((payload.reviewQueue || []).map((item) => item.status)), "全部狀態", reviewFilters.status);
        setSelectOptions("reviewPriorityFilter", uniqueOptions((payload.reviewQueue || []).map((item) => item.priority)), "全部優先序", reviewFilters.priority);
      }

      function updateReviewFilters() {
        reviewFilters.projectId = $("reviewProjectFilter").value;
        reviewFilters.assignee = $("reviewAssigneeFilter").value;
        reviewFilters.status = $("reviewStatusFilter").value;
        reviewFilters.priority = $("reviewPriorityFilter").value;
        renderReviewQueue();
      }

      function renderReviewQueue() {
        const items = filterReviewQueue(dashboardData ? dashboardData.reviewQueue || [] : []);
        $("reviewCountText").textContent = `目前顯示 ${formatNumber(items.length)} 筆，依查核急迫性排序。`;
        $("reviewRows").innerHTML = items.length ? items.map((item) => `
          <tr>
            <td><span class="badge ${escapeHtml(item.level || "reminder")}">${escapeHtml(item.reason || "需查核")}</span></td>
            <td>${escapeHtml(item.office || item.project || "")}</td>
            <td>
              <strong>${escapeHtml(item.caseId || "")}</strong>
              <p class="subtle">${escapeHtml(item.title || "未命名案件")}</p>
            </td>
            <td>${escapeHtml(item.assignee || "未指定")}</td>
            <td>${escapeHtml(item.status || "未填")}</td>
            <td>${escapeHtml(item.deadline || "未填")}</td>
            <td>
              ${escapeHtml(item.reportedAt || "尚無紀錄")}
              <p class="subtle">${escapeHtml(item.reporter || "")}</p>
            </td>
            <td class="text-cell">${escapeHtml(shortText(item.progress || item.completion || "", 90))}</td>
            <td>
              <div class="link-row">
                <a class="button" href="${escapeHtml(item.pageUrl || "#")}" target="_blank" rel="noreferrer">專案頁</a>
                <a class="button" href="${escapeHtml(item.spreadsheetUrl || "#")}" target="_blank" rel="noreferrer">底表</a>
              </div>
            </td>
            <td>
              <div class="action-row">
                <button class="button compact" type="button" data-review-action="approve" data-project-id="${escapeHtml(item.projectId || "")}" data-case-id="${escapeHtml(item.caseId || "")}">通過</button>
                <button class="button compact" type="button" data-review-action="return" data-project-id="${escapeHtml(item.projectId || "")}" data-case-id="${escapeHtml(item.caseId || "")}">退回</button>
                <button class="button compact" type="button" data-review-action="comment" data-project-id="${escapeHtml(item.projectId || "")}" data-case-id="${escapeHtml(item.caseId || "")}">意見</button>
                <button class="button compact" type="button" data-review-action="extend" data-project-id="${escapeHtml(item.projectId || "")}" data-case-id="${escapeHtml(item.caseId || "")}">延長</button>
              </div>
            </td>
          </tr>
        `).join("") : '<tr><td colspan="10">目前沒有符合條件的待查核案件。</td></tr>';
      }

      async function copyCurrentReviewQueue() {
        if (!dashboardData) {
          setMessage("reviewActionMessage", "資料尚未讀取完成。", "error");
          return;
        }
        const items = filterReviewQueue(dashboardData.reviewQueue || []);
        if (!items.length) {
          setMessage("reviewActionMessage", "目前篩選沒有可複製的待查核案件。", "error");
          return;
        }
        const filters = [
          `專案：${selectedOptionText("reviewProjectFilter")}`,
          `同仁：${selectedOptionText("reviewAssigneeFilter")}`,
          `狀態：${selectedOptionText("reviewStatusFilter")}`,
          `優先序：${selectedOptionText("reviewPriorityFilter")}`,
        ].join(" / ");
        const text = [
          "主管待查核清單",
          `資料時間：${dashboardData.generatedAt || ""}`,
          `篩選：${filters}`,
          `件數：${formatNumber(items.length)}`,
          "",
          ...items.slice(0, 80).map((item, index) => buildReviewQueueSummary(item, index + 1)),
        ].join("\n");
        try {
          await copyText(text);
          setMessage("reviewActionMessage", `已複製目前 ${formatNumber(items.length)} 筆待查核清單。`, "success");
        } catch (error) {
          setMessage("reviewActionMessage", "複製失敗，請改用手動選取。", "error");
        }
      }

      function buildReviewQueueSummary(item, index) {
        return [
          `${index}. [${item.reason || "需查核"}] ${item.office || item.project || ""} / ${item.caseId || ""} ${item.title || "未命名案件"}`,
          `   同仁：${item.assignee || "未指定"} / 狀態：${item.status || "未填"} / 優先序：${item.priority || "未填"} / Deadline：${item.deadline || "未填"}`,
          `   最近回報：${item.reportedAt || "尚無紀錄"} ${item.reporter ? "/ " + item.reporter : ""}`,
          `   最新進度：${shortText(item.progress || item.completion || "", 120)}`,
        ].join("\n");
      }

      function selectedOptionText(id) {
        const select = $(id);
        return select.options[select.selectedIndex] ? select.options[select.selectedIndex].textContent : "全部";
      }

      function handleReviewActionClick(event) {
        const button = event.target.closest("[data-review-action]");
        if (!button) return;
        const item = (dashboardData && dashboardData.reviewQueue || []).find((entry) => (
          entry.projectId === button.dataset.projectId && entry.caseId === button.dataset.caseId
        ));
        if (!item) {
          setMessage("reviewActionMessage", "找不到這筆案件，請重新整理後再試。", "error");
          return;
        }
        const payload = buildReviewPayload(button.dataset.reviewAction, item);
        if (!payload) return;
        const label = reviewActionLabel(payload.action);
        if (!window.confirm(`確認${label}？\n\n${item.project}\n${item.caseId} ${item.title || ""}`)) return;
        setReviewButtonsDisabled(true);
        setMessage("reviewActionMessage", `${label}寫入中...`, "");
        google.script.run
          .withSuccessHandler((result) => {
            setReviewButtonsDisabled(false);
            if (!result || result.ok === false) {
              setMessage("reviewActionMessage", result && result.error ? result.error : `${label}失敗`, "error");
              return;
            }
            setMessage("reviewActionMessage", result.message || `${label}完成`, "success");
            loadDashboard();
          })
          .withFailureHandler((error) => {
            setReviewButtonsDisabled(false);
            setMessage("reviewActionMessage", error && error.message ? error.message : `${label}失敗`, "error");
          })
          .reviewCaseAction(payload);
      }

      function buildReviewPayload(action, item) {
        let comment = "";
        let deadline = "";
        if (action === "approve") {
          comment = window.prompt("查核通過說明，可留空：", item.completion || item.progress || "");
          if (comment === null) return null;
          comment = comment.trim();
        } else if (action === "return") {
          comment = window.prompt("請填寫退回補件原因或補件要求：", "");
          if (comment === null) return null;
          comment = comment.trim();
          if (!comment) {
            setMessage("reviewActionMessage", "退回補件請填寫原因或要求。", "error");
            return null;
          }
        } else if (action === "comment") {
          comment = window.prompt("請填寫主管意見：", "");
          if (comment === null) return null;
          comment = comment.trim();
          if (!comment) {
            setMessage("reviewActionMessage", "請填寫主管意見。", "error");
            return null;
          }
        } else if (action === "extend") {
          deadline = window.prompt("請填寫新 Deadline，例：2026-06-10 17:00", item.deadline || "");
          if (deadline === null) return null;
          deadline = deadline.trim();
          if (!deadline) {
            setMessage("reviewActionMessage", "延長 Deadline 請填寫新期限。", "error");
            return null;
          }
          comment = (window.prompt("延長原因或提醒，可留空：", "") || "").trim();
        }
        return {
          projectId: item.projectId,
          caseId: item.caseId,
          action,
          comment,
          deadline,
        };
      }

      function reviewActionLabel(action) {
        return {
          approve: "查核通過",
          return: "退回補件",
          comment: "加註主管意見",
          extend: "延長 Deadline",
        }[action] || "主管查核";
      }

      function setReviewButtonsDisabled(disabled) {
        document.querySelectorAll("[data-review-action]").forEach((button) => {
          button.disabled = disabled;
        });
      }

      function filterReviewQueue(items) {
        return items.filter((item) => {
          if (reviewFilters.projectId && item.projectId !== reviewFilters.projectId) return false;
          if (reviewFilters.assignee && splitClientNames(item.assignee).indexOf(reviewFilters.assignee) < 0) return false;
          if (reviewFilters.status && item.status !== reviewFilters.status) return false;
          if (reviewFilters.priority && item.priority !== reviewFilters.priority) return false;
          return true;
        });
      }

      function setSelectOptions(id, options, allLabel, currentValue) {
        const select = $(id);
        const normalized = options.filter((option) => option.value);
        const hasCurrent = !currentValue || normalized.some((option) => option.value === currentValue);
        const selectedValue = hasCurrent ? currentValue : "";
        select.innerHTML = [
          `<option value="">${escapeHtml(allLabel)}</option>`,
          ...normalized.map((option) => `<option value="${escapeHtml(option.value)}">${escapeHtml(option.label)}</option>`),
        ].join("");
        select.value = selectedValue;
      }

      function uniqueOptions(values) {
        return [...new Set(values.filter(Boolean))]
          .sort((a, b) => a.localeCompare(b, "zh-Hant"))
          .map((value) => ({ value, label: value }));
      }

      function splitClientNames(value) {
        return String(value || "")
          .split(/[\n、,，/]+/)
          .map((name) => name.trim().replace(/\(.+?\)/g, ""))
          .filter((name) => name && ["主責", "協辦", "主責及協辦", "負責同仁"].indexOf(name) < 0);
      }

      function renderReminder(payload) {
        const emailText = payload.reminderStatus.emailEnabled ? "Email 已啟用" : "Email 未設定";
        const lineText = payload.reminderStatus.lineEnabled ? "LINE 已啟用" : "LINE 尚未設定 webhook";
        $("reminderStatus").textContent = `${emailText} / ${lineText}`;
        $("reminderText").value = payload.reminderText || "";
        const items = [
          ...(payload.priorities.today || []).slice(0, 4),
          ...(payload.priorities.overdue || []).slice(0, 4),
          ...(payload.priorities.week || []).slice(0, 4),
        ];
        $("reminderPreview").innerHTML = items.length ? items.map((item) => `
          <article class="item ${item.reason === "已逾期" ? "critical" : item.reason === "今日到期" ? "today" : "warning"}">
            <strong>${escapeHtml(item.project)} / ${escapeHtml(item.title || "未命名")}</strong>
            <p>${escapeHtml(item.assignee || "未指定")} / ${escapeHtml(item.reason || "")}</p>
          </article>
        `).join("") : '<p class="subtle">目前沒有高優先提醒。</p>';
      }

      function renderReport() {
        if (!dashboardData) {
          $("reportText").value = "";
          setMessage("reportMessage", "資料尚未讀取完成。", "");
          return;
        }
        ensureReportPeriod();
        $("reportText").value = buildCompanyReport(dashboardData, $("reportTypeInput").value);
        setMessage("reportMessage", "報告已依目前總控台資料產生。", "");
      }

      function handleReportTypeChange() {
        $("reportPeriodInput").value = defaultReportPeriod($("reportTypeInput").value);
        renderReport();
      }

      async function copyReportText() {
        const text = $("reportText").value;
        if (!text) {
          setMessage("reportMessage", "目前沒有可複製的報告。", "error");
          return;
        }
        try {
          await copyText(text, $("reportText"));
          setMessage("reportMessage", "已複製報告文字。", "success");
        } catch (error) {
          setMessage("reportMessage", "複製失敗，請直接選取報告文字。", "error");
        }
      }

      function downloadReportText() {
        const text = $("reportText").value;
        if (!text) {
          setMessage("reportMessage", "目前沒有可下載的報告。", "error");
          return;
        }
        const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = reportFileName();
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(link.href);
        setMessage("reportMessage", "已下載報告文字檔。", "success");
      }

      function buildCompanyReport(data, type) {
        const label = type === "monthly" ? "月報" : "週報";
        const period = $("reportPeriodInput").value.trim() || defaultReportPeriod(type);
        const note = $("reportNoteInput").value.trim();
        const totals = data.totals || {};
        const projects = data.projects || [];
        const reviewQueue = data.reviewQueue || [];
        const peopleStatus = data.peopleStatus || [];
        const issues = data.issues || [];
        const priorities = data.priorities || {};
        const highPeople = peopleStatus.filter((person) => person.level === "high");
        const mediumPeople = peopleStatus.filter((person) => person.level === "medium");
        const lines = [
          `公司專案${label}`,
          `報告期間：${period}`,
          `資料時間：${data.generatedAt || ""}`,
          `主管帳號：${data.viewer || ""}`,
          "",
          "一、整體狀態",
          `- 專案數：${formatNumber(totals.projects)}；紅燈 ${formatNumber(totals.redProjects)}、黃燈 ${formatNumber(totals.yellowProjects)}、綠燈 ${formatNumber(totals.greenProjects)}`,
          `- 待追蹤工項：${formatNumber(totals.needsFollowUp)}；未完成案件：${formatNumber(totals.openCases)}；本月諮詢輔導：${formatNumber(totals.consultationsThisMonth)}`,
          "",
          "二、各專案摘要",
          ...reportProjectLines(projects),
          "",
          "三、待查核與優先追蹤",
          ...reportReviewLines(reviewQueue, priorities),
          "",
          "四、同仁回報狀態",
          ...reportPeopleLines(highPeople, mediumPeople),
          "",
          "五、資料品質提醒",
          ...reportIssueLines(issues),
          "",
          "六、建議下一步",
          ...reportNextStepLines(reviewQueue, highPeople, issues),
        ];
        if (note) {
          lines.push("", "七、主管補充重點", ...note.split("\n").map((line) => `- ${line}`));
        }
        return lines.join("\n");
      }

      function ensureReportPeriod() {
        if (!$("reportPeriodInput").value.trim()) {
          $("reportPeriodInput").value = defaultReportPeriod($("reportTypeInput").value);
        }
      }

      function defaultReportPeriod(type) {
        const now = new Date();
        if (type === "monthly") return `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`;
        const start = new Date(now);
        const dayOffset = (now.getDay() + 6) % 7;
        start.setDate(now.getDate() - dayOffset);
        const end = new Date(start);
        end.setDate(start.getDate() + 6);
        return `${formatLocalDate(start)} 至 ${formatLocalDate(end)}`;
      }

      function reportFileName() {
        const type = $("reportTypeInput").value === "monthly" ? "月報" : "週報";
        const period = $("reportPeriodInput").value.trim().replace(/[^0-9A-Za-z\u4e00-\u9fa5]+/g, "-").replace(/^-|-$/g, "");
        return `公司專案${type}-${period || formatLocalDate(new Date())}.txt`;
      }

      function formatLocalDate(date) {
        return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(date.getDate()).padStart(2, "0")}`;
      }

      function reportProjectLines(projects) {
        if (!projects.length) return ["- 目前沒有專案資料。"];
        return projects.map((project, index) => {
          const status = project.status === "red" ? "紅燈" : project.status === "yellow" ? "黃燈" : "綠燈";
          const metrics = project.metrics || {};
          return `${index + 1}. ${project.name}：${status}；工項 ${formatNumber(metrics.doneItems)}/${formatNumber(metrics.items)}；需追蹤 ${formatNumber(metrics.needsFollowUp)}；未完成案件 ${formatNumber(metrics.openCases)}；逾期 ${formatNumber(metrics.overdueCases)}；待查核 ${formatNumber(metrics.awaitingReview)}；本月輔導 ${formatNumber(metrics.consultationsThisMonth)}`;
        });
      }

      function reportReviewLines(reviewQueue, priorities) {
        const lines = [
          `- 逾期：${formatNumber((priorities.overdue || []).length)}；今天必追：${formatNumber((priorities.today || []).length)}；本週需追：${formatNumber((priorities.week || []).length)}；待查核清單：${formatNumber(reviewQueue.length)}`,
        ];
        const topItems = reviewQueue.slice(0, 10);
        if (!topItems.length) return lines.concat(["- 目前沒有待查核案件。"]);
        return lines.concat(topItems.map((item, index) => (
          `${index + 1}. [${item.reason || "需查核"}] ${item.office || item.project || ""} / ${item.caseId || ""} ${item.title || "未命名案件"} / ${item.assignee || "未指定"} / Deadline：${item.deadline || "未填"}`
        )));
      }

      function reportPeopleLines(highPeople, mediumPeople) {
        const lines = [
          `- 今天要追：${formatNumber(highPeople.length)} 位；本週追蹤：${formatNumber(mediumPeople.length)} 位`,
        ];
        const people = highPeople.concat(mediumPeople).slice(0, 12);
        if (!people.length) return lines.concat(["- 目前沒有高優先同仁提醒。"]);
        return lines.concat(people.map((person, index) => (
          `${index + 1}. ${person.name} / ${person.actionText || "持續觀察"} / ${person.projects || ""} / 未完成案件 ${formatNumber(person.openCases)} / 逾期 ${formatNumber(person.overdueCases)} / 待查核 ${formatNumber(person.pendingReview)} / 近7日更新 ${formatNumber(person.recentUpdates)}`
        )));
      }

      function reportIssueLines(issues) {
        if (!issues.length) return ["- 目前沒有資料品質提醒。"];
        return issues.slice(0, 10).map((issue, index) => (
          `${index + 1}. [${issue.level || "notice"}] ${issue.project || ""} / ${issue.title || ""}：${issue.detail || ""}`
        ));
      }

      function reportNextStepLines(reviewQueue, highPeople, issues) {
        const steps = [];
        if (reviewQueue.length) steps.push("處理主管待查核清單前 10 筆，優先處理逾期、今日到期與待查核案件。");
        if (highPeople.length) steps.push("提醒今天要追的同仁補最新進度、完成說明或佐證資料。");
        if (issues.length) steps.push("補齊資料品質提醒中的缺漏欄位，避免月底彙整時資料不完整。");
        if (!steps.length) steps.push("維持目前回報節奏，週五前再次確認已完成案件是否可解除列管。");
        return steps.map((step, index) => `${index + 1}. ${step}`);
      }

      function submitAssignment(event) {
        event.preventDefault();
        const payload = {
          projectId: $("assignmentProjectInput").value,
          assignee: $("assignmentAssigneeInput").value.trim(),
          title: $("assignmentTitleInput").value.trim(),
          deadline: $("assignmentDeadlineInput").value,
          priority: $("assignmentPriorityInput").value,
          status: $("assignmentStatusInput").value,
          instruction: $("assignmentInstructionInput").value.trim(),
          checkpoint: $("assignmentCheckpointInput").value.trim(),
          note: $("assignmentNoteInput").value.trim(),
          attachment: $("assignmentAttachmentInput").value.trim(),
        };
        if (!payload.projectId || !payload.assignee || !payload.title || !payload.deadline || !payload.instruction) {
          setMessage("assignmentMessage", "請填寫專案、指定同事、案件名稱、Deadline 與交辦內容。", "error");
          return;
        }
        if (!window.confirm(`確認送出交辦？\n\n案件：${payload.title}\n指定同事：${payload.assignee}\nDeadline：${payload.deadline}`)) return;
        $("assignmentSubmitButton").disabled = true;
        setMessage("assignmentMessage", "送出中...", "");
        google.script.run
          .withSuccessHandler((result) => {
            $("assignmentSubmitButton").disabled = false;
            if (!result || result.ok === false) {
              setMessage("assignmentMessage", result && result.error ? result.error : "送出失敗", "error");
              return;
            }
            setMessage("assignmentMessage", `已新增交辦：${result.caseId}`, "success");
            $("assignmentForm").reset();
            loadDashboard();
          })
          .withFailureHandler((error) => {
            $("assignmentSubmitButton").disabled = false;
            setMessage("assignmentMessage", error && error.message ? error.message : "送出失敗", "error");
          })
          .createAssignment(payload);
      }

      function sendReminderDigest() {
        if (!dashboardData) {
          setMessage("reminderMessage", "資料尚未讀取完成。", "error");
          return;
        }
        if (!window.confirm("確認寄出公司專案提醒摘要？")) return;
        $("sendReminderButton").disabled = true;
        setMessage("reminderMessage", "寄送中...", "");
        google.script.run
          .withSuccessHandler((result) => {
            $("sendReminderButton").disabled = false;
            if (!result || result.ok === false) {
              setMessage("reminderMessage", result && result.error ? result.error : "寄送失敗", "error");
              return;
            }
            setMessage("reminderMessage", `已寄出 Email：${(result.emailRecipients || []).join("、")}${result.lineSent ? "；LINE 已送出" : ""}`, "success");
          })
          .withFailureHandler((error) => {
            $("sendReminderButton").disabled = false;
            setMessage("reminderMessage", error && error.message ? error.message : "寄送失敗", "error");
          })
          .sendReminderDigest();
      }

      async function copyReminderText() {
        const text = $("reminderText").value;
        if (!text) {
          setMessage("reminderMessage", "目前沒有可複製的提醒摘要。", "error");
          return;
        }
        try {
          await copyText(text, $("reminderText"));
          setMessage("reminderMessage", "已複製提醒摘要。", "success");
        } catch (error) {
          setMessage("reminderMessage", "複製失敗，請直接選取摘要文字。", "error");
        }
      }

      async function copyText(text, fallbackElement) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(text);
          return;
        }
        if (fallbackElement && fallbackElement.select) {
          fallbackElement.select();
          document.execCommand("copy");
          return;
        }
        const textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.style.position = "fixed";
        textarea.style.left = "-9999px";
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand("copy");
        document.body.removeChild(textarea);
      }

      function setMessage(id, text, type) {
        const element = $(id);
        element.textContent = text;
        element.className = `message ${type || ""}`;
      }

      function mini(label, value) {
        return `<div class="mini"><span>${escapeHtml(label)}</span><strong>${formatNumber(value)}</strong></div>`;
      }

      function formatNumber(value) {
        if (typeof value === "number") return value.toLocaleString("zh-TW");
        return value == null ? "0" : String(value);
      }

      function shortText(value, maxLength) {
        const text = String(value || "").trim();
        if (text.length <= maxLength) return text || "未填";
        return `${text.slice(0, maxLength)}...`;
      }

      function escapeHtml(value) {
        return String(value == null ? "" : value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }
    </script>
  </body>
</html>
